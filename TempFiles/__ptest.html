<!doctype html><html><head><meta charset="utf-8"><title>ptest</title>
<style>html,body{height:100%}#map{height:400px}</style>
<script type="importmap">
{ "imports": {
  "@arcgis/core/": "/node_modules/@arcgis/core/"
}}
</script>
</head><body>
<div id="map"></div><div id="out">loading</div>
<script type="module">
import Map from "/node_modules/@arcgis/core/Map.js";
import MapView from "/node_modules/@arcgis/core/views/MapView.js";
import GraphicsLayer from "/node_modules/@arcgis/core/layers/GraphicsLayer.js";
import Graphic from "/node_modules/@arcgis/core/Graphic.js";
import Point from "/node_modules/@arcgis/core/geometry/Point.js";
import Symbol from "/node_modules/@arcgis/core/symbols/Symbol.js";
const out = document.getElementById("out");
const PIN = "M16 3.5c-4.4 0-8 3.6-8 8 0 5.7 8 14.5 8 14.5s8-8.8 8-14.5c0-4.4-3.6-8-8-8zM16 14a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z";
try {
  const res = await fetch("/api/mock");
  const mock = await res.json();
  const tour = mock.tours[0];
  const route = tour.route;
  const pts = route.features.filter(f => f.geometry && (f.geometry.type === "point" || (f.geometry.x !== undefined && !f.geometry.paths)));
  out.textContent = "features=" + route.features.length + " points=" + pts.length;
  const map = new Map({basemap: "dark-gray"});
  const view = new MapView({container:"map", map, center:[3,25], zoom:4});
  const layer = new GraphicsLayer({id:"pd"});
  view.map.add(layer);
  let added = 0;
  route.features.forEach(feature => {
    const g = feature.geometry;
    if (g && (g.type === "point" || (g.x !== undefined && g.y !== undefined && !g.paths))) {
      let sym = {type:"simple-marker", style:"path", path:PIN, color:"#0cff25", size:26, outline:{color:"#06210b",width:1.5}};
      if (feature.properties && feature.properties.symbol) {
        try { sym = Symbol.fromJSON(feature.properties.symbol); } catch(e){ out.textContent += " | fromJSONERR "+e.message; }
      }
      const gr = new Graphic({geometry:new Point(g), symbol:sym, attributes:feature.properties||{}});
      layer.add(gr); added++;
    }
  });
  out.textContent += " | addedToLayer=" + added + " layerCount=" + layer.graphics.length;
} catch(e){ out.textContent = "FATAL " + e.message; }
</script>
</body></html>
